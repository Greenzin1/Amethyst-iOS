name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Install dependencies
        run: brew install cmake wget && brew install ldid || brew install ProcursusTeam/procursus/ldid

      - name: Build IPA
        run: |
          export JAVA_HOME="$JAVA_HOME_8_ARM64"
          export PATH="$JAVA_HOME/bin:/opt/homebrew/bin:$PATH"
          javac -version
          make -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2 SLIMMED=1 BOOTJDK="$JAVA_HOME/bin"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-iOS-Sideload
          path: artifacts/*.ipa

      - name: Upload Tipa (TrollStore)
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-iOS-TrollStore
          path: artifacts/*-trollstore.tipa
